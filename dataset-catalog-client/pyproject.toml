[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "catalog-client"
version = "1.0.0"
description = "Python client library for the Scientific Dataset Catalog API"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "boto3>=1.42.90",
    "httpx==0.28.1",
    "pydantic>=2.10.0",
]

[project.scripts]
catalog = "catalog_client.cli:main"

[project.optional-dependencies]
# Named `notebook`, not `dev`: this ships jupyter to users who want to run the
# quickstart, and is published. The local toolchain — pytest, ruff, mypy — is
# the `dev` entry under [dependency-groups], which is not published. Two
# things called `dev` invited installing one and expecting the other.
notebook = [
  "jupyter>=1.1.1",
]
checksum = [
  "blake3>=0.3.0",
  "awscrt>=0.32.1",
  "crcmod>=1.7",
]
dataframe = [
  # 3.0 is the only line still receiving releases (2.x ended at 2.3.3), and it
  # requires Python >=3.11, which this package already floors at — so pinning
  # here strands no supported interpreter. Matching the floor to the line CI
  # resolves means the version we test is the version we promise.
  "pandas>=3.0",
]

[tool.ruff]
target-version = "py311"
exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[dependency-groups]
# Test and lint tooling only; jupyter lives in the `notebook` extra.
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.9.0",
    "moto>=4.0.0",
    "mypy>=2.0.0",
    "pandas>=3.0",
]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore.*", "crcmod", "crcmod.*", "awscrt.*", "pandas", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# moto hands out stock clients whose pool sits below DEFAULT_S3_WORKERS, so
# most S3 tests legitimately trip the clamp. Silenced here rather than per
# test; the tests that assert on it use pytest.warns, which overrides this.
filterwarnings = [
    "ignore::catalog_client.utils.checksum.ChecksumPoolWarning",
]
