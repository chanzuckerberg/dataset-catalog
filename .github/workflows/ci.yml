name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: dataset-catalog-client

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install pre-commit
        run: uv tool install pre-commit
      - name: Run pre-commit
        run: uv tool run pre-commit run --all-files

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Run pytest
        run: uv run --python ${{ matrix.python-version }} --group dev --extra checksum --extra dataframe pytest

  pandas-floor:
    name: Test dataframe utils at the declared pandas floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # The test job resolves the newest pandas, so the floor declared in
      # pyproject.toml's `dataframe` extra is otherwise never exercised. The
      # version is repeated here because `--with` is what pins it — keep it in
      # step with the extra's lower bound.
      - name: Run pytest against pandas 2.2.0
        run: uv run --python 3.11 --group dev --extra checksum --extra dataframe --with 'pandas==2.2.0' pytest tests/utils/dataframe
